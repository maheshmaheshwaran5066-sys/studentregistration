<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet" href="edit-student.css">

</head>


<body>

    <div class="container">

        <header class="form-header">

            <div>

                <p class="page-label">
                    STUDENT MANAGEMENT
                </p>

                <h1>Edit Student</h1>

                <p>
                    Update the student's information below
                </p>

            </div>


            <a
                href="/students.html"
                class="back-btn"
            >
                ← Back to Students
            </a>

        </header>


        <!-- ========================= -->
        <!-- LOADING -->
        <!-- ========================= -->

        <div
            id="loading"
            class="loading"
        >
            Loading student information...
        </div>


        <!-- ========================= -->
        <!-- FORM -->
        <!-- ========================= -->

        <form
            id="editStudentForm"
            style="display: none;"
        >


            <!-- ========================= -->
            <!-- PERSONAL DETAILS -->
            <!-- ========================= -->

            <section class="form-section">

                <h2>Personal Details</h2>

                <div class="form-grid">


                    <div class="form-group full-width">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="dateOfBirth">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="dateOfBirth"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender"
                            required
                        >

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="alternatePhone">
                            Alternate Phone
                        </label>

                        <input
                            type="tel"
                            id="alternatePhone"
                            maxlength="10"
                        >

                    </div>


                    <div class="form-group">

                        <label for="bloodGroup">
                            Blood Group
                        </label>

                        <select
                            id="bloodGroup"
                            required
                        >

                            <option value="">
                                Select Blood Group
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="aadharNumber">
                            Aadhaar Number
                        </label>

                        <input
                            type="text"
                            id="aadharNumber"
                            maxlength="12"
                        >

                    </div>

                </div>

            </section>



            <!-- ========================= -->
            <!-- ACADEMIC DETAILS -->
            <!-- ========================= -->

            <section class="form-section">

                <h2>Academic Details</h2>

                <div class="form-grid">


                    <div class="form-group">

                        <label for="registerNumber">
                            Register Number
                        </label>

                        <input
                            type="text"
                            id="registerNumber"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <select
                            id="course"
                            required
                        >

                            <option value="">
                                Select Course
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="B.Sc">
                                B.Sc
                            </option>

                            <option value="BBA">
                                BBA
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select
                            id="department"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                            <option value="Computer Science">
                                Computer Science
                            </option>

                            <option value="Information Technology">
                                Information Technology
                            </option>

                            <option value="Artificial Intelligence">
                                Artificial Intelligence
                            </option>

                            <option value="Electronics">
                                Electronics
                            </option>

                            <option value="Mechanical">
                                Mechanical
                            </option>

                            <option value="Civil">
                                Civil
                            </option>

                            <option value="Commerce">
                                Commerce
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="year">
                            Year
                        </label>

                        <select
                            id="year"
                            required
                        >

                            <option value="">
                                Select Year
                            </option>

                            <option value="1st Year">
                                1st Year
                            </option>

                            <option value="2nd Year">
                                2nd Year
                            </option>

                            <option value="3rd Year">
                                3rd Year
                            </option>

                            <option value="4th Year">
                                4th Year
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="semester">
                            Semester
                        </label>

                        <select
                            id="semester"
                            required
                        >

                            <option value="">
                                Select Semester
                            </option>

                            <option value="Semester 1">
                                Semester 1
                            </option>

                            <option value="Semester 2">
                                Semester 2
                            </option>

                            <option value="Semester 3">
                                Semester 3
                            </option>

                            <option value="Semester 4">
                                Semester 4
                            </option>

                            <option value="Semester 5">
                                Semester 5
                            </option>

                            <option value="Semester 6">
                                Semester 6
                            </option>

                            <option value="Semester 7">
                                Semester 7
                            </option>

                            <option value="Semester 8">
                                Semester 8
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="admissionYear">
                            Admission Year
                        </label>

                        <input
                            type="number"
                            id="admissionYear"
                            min="2000"
                            max="2100"
                            required
                        >

                    </div>

                </div>

            </section>



            <!-- ========================= -->
            <!-- ADDRESS -->
            <!-- ========================= -->

            <section class="form-section">

                <h2>Address Details</h2>

                <div class="form-grid">


                    <div class="form-group full-width">

                        <label for="address">
                            Full Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="pincode">
                            Pincode
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            maxlength="6"
                            required
                        >

                    </div>

                </div>

            </section>



            <!-- ========================= -->
            <!-- PARENT / GUARDIAN -->
            <!-- ========================= -->

            <section class="form-section">

                <h2>Parent / Guardian Details</h2>

                <div class="form-grid">


                    <div class="form-group">

                        <label for="fatherName">
                            Father's Name
                        </label>

                        <input
                            type="text"
                            id="fatherName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="motherName">
                            Mother's Name
                        </label>

                        <input
                            type="text"
                            id="motherName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="parentPhone">
                            Parent Phone
                        </label>

                        <input
                            type="tel"
                            id="parentPhone"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="parentEmail">
                            Parent Email
                        </label>

                        <input
                            type="email"
                            id="parentEmail"
                            required
                        >

                    </div>

                </div>

            </section>



            <!-- ========================= -->
            <!-- ADDITIONAL INFORMATION -->
            <!-- ========================= -->

            <section class="form-section">

                <h2>Additional Information</h2>

                <div class="form-grid">


                    <div class="form-group">

                        <label for="nationality">
                            Nationality
                        </label>

                        <input
                            type="text"
                            id="nationality"
                        >

                    </div>


                    <div class="form-group">

                        <label for="religion">
                            Religion
                        </label>

                        <input
                            type="text"
                            id="religion"
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category">

                            <option value="">
                                Select Category
                            </option>

                            <option value="General">
                                General
                            </option>

                            <option value="OBC">
                                OBC
                            </option>

                            <option value="SC">
                                SC
                            </option>

                            <option value="ST">
                                ST
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="emergencyContact">
                            Emergency Contact
                        </label>

                        <input
                            type="tel"
                            id="emergencyContact"
                            maxlength="10"
                        >

                    </div>


                    <div class="form-group checkbox-group">

                        <label>

                            <input
                                type="checkbox"
                                id="hostelRequired"
                            >

                            Hostel Required

                        </label>

                    </div>


                    <div class="form-group checkbox-group">

                        <label>

                            <input
                                type="checkbox"
                                id="transportRequired"
                            >

                            Transport Required

                        </label>

                    </div>

                </div>

            </section>



            <!-- ========================= -->
            <!-- UPDATE BUTTON -->
            <!-- ========================= -->

            <button
                type="submit"
                class="submit-btn"
            >
                Update Student
            </button>


            <div id="message"></div>


        </form>


        <!-- ========================= -->
        <!-- ERROR -->
        <!-- ========================= -->

        <div
            id="errorMessage"
            class="error-message"
        >
        </div>


    </div>


    <script src="edit-student.js"></script>

</body>

</html>
