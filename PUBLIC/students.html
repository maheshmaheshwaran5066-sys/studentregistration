<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <link rel="stylesheet" href="students.css">

</head>


<body>

    <div class="dashboard">


        <!-- ========================= -->
        <!-- HEADER -->
        <!-- ========================= -->
<header class="dashboard-header">

    <div>

        <h1>Student Management</h1>

        <p>Manage registered students</p>

    </div>


    <div class="header-actions">

        <a
            href="/about.html"
            class="about-btn"
        >
            About Project
        </a>

        <a
            href="/"
            class="add-btn"
        >
            + Register Student
        </a>

    </div>

</header>



        <!-- ========================= -->
        <!-- SEARCH -->
        <!-- ========================= -->

        <div class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, email or register number..."
            >

        </div>



        <!-- ========================= -->
        <!-- STUDENT TABLE -->
        <!-- ========================= -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Register No.</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Course</th>

                        <th>Department</th>

                        <th>Year</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="studentTableBody">

                    <!-- Students will be inserted here -->

                </tbody>

            </table>

        </div>



        <!-- ========================= -->
        <!-- EMPTY MESSAGE -->
        <!-- ========================= -->

        <div
            id="emptyMessage"
            class="empty-message"
        >
            No students found.
        </div>


    </div>



    <script src="students.js"></script>

</body>

</html>
